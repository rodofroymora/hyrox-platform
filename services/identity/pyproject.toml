[tool.poetry]
name = "identity"
version = "0.1.0"
description = "Identity service — HYROX Performance Platform"
authors = ["Rodolfo Froylan Mora <rodolfo.froylan.mora@gmail.com>"]
license = "Proprietary"
packages = [{include = "identity"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.34.0"}
pydantic = "^2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
httpx = "^0.28"
mypy = "^1.14"
ruff = "^0.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
strict = true
python_version = "3.12"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
